name: backtest_data

# Fetches five years of daily Brent prices for the Bot 5 backtest and commits
# backtest/brent_daily.csv. Manual only.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oil-signal-logger
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch daily Brent
        run: python -m scripts.fetch_brent_daily
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Backtest data: daily Brent $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin main || true
            git push
          fi

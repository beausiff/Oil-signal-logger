name: backup

# 255 signal rows and nearly 4000 headlines live in one Google Sheet with no
# copy anywhere. One bad click and the experiment is gone. This exports every
# tab to CSV in the repository once a week, which makes the data as durable as
# the code and costs nothing.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oil-signal-logger
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export the sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -m scripts.backup
      - name: Commit any change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/
          if git diff --staged --quiet; then
            echo "sheet unchanged since last backup"
          else
            git commit -m "Weekly sheet backup $(date -u +%Y-%m-%d)"
            git push
          fi

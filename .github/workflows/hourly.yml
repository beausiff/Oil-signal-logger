name: hourly

on:
  schedule:
    # Deliberately NOT near the top of the hour. GitHub warns that the
    # schedule event is delayed during peak load, and the start of every hour
    # is the peak: the first two runs at :05 were dropped entirely. :23 sits
    # in a quiet minute.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print everything, write nothing"
        type: boolean
        default: false

concurrency:
  group: oil-signal-logger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly logger
        env:
          # The repository secrets are named ANTHROPIC and OILTRACKER.
          # The code always reads the *_API_KEY names below.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          # Only needed when the Anthropic key is organisation scoped rather
          # than workspace scoped. Harmless to leave unset.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          OILPRICE_API_KEY: ${{ secrets.OILTRACKER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

name: hourly

on:
  schedule:
    # Every 10 minutes, not hourly, and deliberately off the top of the hour.
    # GitHub drops most scheduled runs under load, so asking once an hour
    # loses the hour. Six attempts an hour, at odd minutes, nearly always
    # lands one. src/main.py keeps the first and stops the rest before they
    # spend anything, so this is six cheap attempts, not six runs.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print everything, write nothing"
        type: boolean
        default: false
      force:
        description: "Ignore the minimum gap since the last run"
        type: boolean
        default: true

concurrency:
  group: oil-signal-logger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly logger
        env:
          # The repository secrets are named ANTHROPIC and OILTRACKER.
          # The code always reads the *_API_KEY names below.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          # Only needed when the Anthropic key is organisation scoped rather
          # than workspace scoped. Harmless to leave unset.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          OILPRICE_API_KEY: ${{ secrets.OILTRACKER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          # A hand started run is normally meant, so it defaults to skipping
          # the gap guard. Setting force=false is how the guard itself gets
          # tested without waiting for a scheduled tick. On a scheduled run
          # the input is unset, so the guard always applies.
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE="--force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run $FORCE
          else
            python -m src.main $FORCE
          fi

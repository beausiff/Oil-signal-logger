name: hourly

on:
  schedule:
    # Hourly, deliberately off the top of the hour. GitHub only delivers about
    # 3 to 4 of these a day for this repository. Six attempts an hour was tried
    # and made no measurable difference, so this is back to one. The gap guard
    # in src/main.py is kept: it is harmless and an external scheduler needs it.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print everything, write nothing"
        type: boolean
        default: false
      force:
        description: "Ignore the minimum gap since the last run"
        type: boolean
        default: true

# Write access is only for the hourly backup commit below.
permissions:
  contents: write

concurrency:
  group: oil-signal-logger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly logger
        env:
          # The repository secrets are named ANTHROPIC and OILTRACKER.
          # The code always reads the *_API_KEY names below.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          # Only needed when the Anthropic key is organisation scoped rather
          # than workspace scoped. Harmless to leave unset.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          OILPRICE_API_KEY: ${{ secrets.OILTRACKER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          # Optional. Used for the EIA weekly stocks context column. Without it
          # the code falls back to the public DEMO_KEY, so leaving it unset is
          # harmless (an unset secret reaches the job as an empty string).
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # OANDA practice mirror (fake money). Off unless the BROKER_MODE repository
          # variable is set to demo. Delete that variable to switch it off.
          BROKER_MODE: ${{ vars.BROKER_MODE }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_INSTRUMENT: ${{ vars.OANDA_INSTRUMENT }}
          OANDA_UNITS: ${{ vars.OANDA_UNITS }}
        run: |
          # A hand started run is normally meant, so it defaults to skipping
          # the gap guard. Setting force=false is how the guard itself gets
          # tested without waiting for a scheduled tick. On a scheduled run
          # the input is unset, so the guard always applies.
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE="--force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run $FORCE
          else
            python -m src.main $FORCE
          fi

      # Copy the sheet into backup/ every hour, so the race page can be
      # rebuilt from the repository alone (its refresh button does that)
      # without anyone needing access to the sheet. Never fails the run.
      - name: Hourly sheet backup
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python -m scripts.backup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/
          if git diff --staged --quiet; then
            echo "sheet unchanged since last backup"
          else
            git commit -m "Hourly sheet backup $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --quiet origin main
            git push
          fi

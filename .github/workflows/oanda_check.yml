name: oanda_check

# Hand started only. Logs in to the OANDA practice account and lists matching
# markets. Places no orders.

on:
  workflow_dispatch:
    inputs:
      search:
        description: "Market search term"
        default: "Brent"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check OANDA practice
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          SEARCH: ${{ inputs.search }}
        run: python -m scripts.oanda_check "$SEARCH"

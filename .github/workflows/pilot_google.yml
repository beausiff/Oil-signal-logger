name: pilot_google

# Pilot: can Google News RSS with after:/before: operators serve historical
# headlines? Part A rescored 90 minute windows against live scores, Part B is a
# depth check with no model spend. Hard cap of 60 model requests in total,
# counted in backtest/pilot_google_calls_used.txt. Manual only.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Process at most N new rows (0 = the whole sample)"
        type: string
        default: "0"

permissions:
  contents: write

# Own queue; never share the hourly bot's group.
concurrency:
  group: oil-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the pilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m scripts.pilot_google_vs_live --limit ${{ inputs.limit }}
      # Runs even if the pilot fails part way, so the call counter and any rows
      # done so far are never lost.
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/pilot_google_vs_live.txt backtest/pilot_google_vs_live.csv backtest/pilot_google_calls_used.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Pilot results: Google News dated headlines versus live"
            git pull --rebase -q origin main || true
            git push
          fi
